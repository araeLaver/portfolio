name: Build and Package for Mac Mini

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Run tests
      run: mvn test

    - name: Create production artifact
      if: success()
      run: |
        mkdir -p artifacts
        cp target/*.jar artifacts/ || true

    - name: Deploy target (manual/offline)
      if: success()
      run: |
        echo "Deployment target is mac-mini self-hosted."
        echo "Deploy mac-mini locally by running:"
        echo "  ./scripts/deploy-macmini.sh"
